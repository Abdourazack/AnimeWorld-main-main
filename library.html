<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeWorld — Bibliothèque</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="data:," />
  </head>

  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <h1 class="brand">Ma Bibliothèque</h1>

        <div class="topbar__actions">
          <button id="theme-toggle" class="btn btn--ghost" type="button">
            🌙 Mode sombre
          </button>
          <button class="btn" id="back-home" type="button">Accueil</button>
          <button class="btn btn--primary" id="go-catalogue" type="button">
            Catalogue
          </button>
        </div>
      </div>
    </header>

    <section id="library-list">
      <div id="library-empty" class="empty" style="display: none;">
        <h2>Aucun anime dans ta bibliothèque</h2>
        <p>Ajoute-en depuis le catalogue 🙂</p>
      </div>

      <div id="library-cards"></div>
    </section>

    <footer>
      <p>&copy; 2024 Manga & Anime App</p>
    </footer>

    <script type="module" src="./library.js"></script>

    <script>
      const root = document.documentElement;
      const btn = document.getElementById("theme-toggle");

      const saved = localStorage.getItem("theme");
      if (saved === "dark") root.classList.add("theme-dark");

      function updateLabel() {
        const isDark = root.classList.contains("theme-dark");
        if (btn) btn.textContent = isDark ? "☀️ Mode clair" : "🌙 Mode sombre";
      }

      btn?.addEventListener("click", () => {
        root.classList.toggle("theme-dark");
        localStorage.setItem(
          "theme",
          root.classList.contains("theme-dark") ? "dark" : "light"
        );
        updateLabel();
      });

      updateLabel();
    </script>

    <script>
      document.getElementById("back-home")?.addEventListener("click", () => {
        window.location.href = "acceuil.html";
      });
      document.getElementById("go-catalogue")?.addEventListener("click", () => {
        window.location.href = "catalogue.html";
      });
    </script>
  </body>
</html>
